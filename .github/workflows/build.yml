name: build-windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Qlvb.slnx

      - name: Build
        run: dotnet build Qlvb.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/Qlvb.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test-results

      - name: Publish (single-file, self-contained, win-x64)
        id: publish
        run: dotnet publish src/Qlvb.App -c Release -o artifacts/publish

      - name: UI smoke tests (FlaUI)
        run: dotnet test tests/Qlvb.UiTests -c Release --logger "trx;LogFileName=ui.trx" --results-directory artifacts/test-results
        env:
          QLVB_EXE: ${{ github.workspace }}\artifacts\publish\QLVB.exe
          QLVB_SCREENSHOTS: ${{ github.workspace }}\artifacts\screenshots

      - name: Portable package
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: pwsh
        run: |
          $p = "artifacts/portable/QLVB-portable"
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item artifacts/publish/QLVB.exe $p
          Set-Content -Path "$p/portable.flag" -Value "Ban portable: du lieu luu trong thu muc Data canh QLVB.exe" -Encoding utf8
          if (Test-Path docs) { Copy-Item -Recurse docs "$p/docs" }
          Copy-Item README.md, LICENSE, NOTICE.md -Destination $p -ErrorAction SilentlyContinue
          Compress-Archive -Path "$p/*" -DestinationPath artifacts/QLVB-portable-win-x64.zip -Force

      - name: Installer (Inno Setup)
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp installer/qlvb.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksums
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: pwsh
        run: |
          Get-ChildItem artifacts/*.zip, artifacts/installer/*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content artifacts/SHA256SUMS.txt
          Get-ChildItem artifacts/*.zip, artifacts/installer/*.exe | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.Name }
          Get-Content artifacts/SHA256SUMS.txt
          if (-not (Test-Path artifacts/installer/*.exe) -or -not (Test-Path artifacts/*.zip)) { Write-Error "Thieu goi cai dat hoac ban portable"; exit 1 }

      - name: Publish screenshots to branch ci-screenshots
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/screenshots)) { exit 0 }
          $dst = Join-Path $env:RUNNER_TEMP "shots"
          git worktree add --orphan -b ci-screenshots-tmp $dst 2>$null
          if ($LASTEXITCODE -ne 0) { New-Item -ItemType Directory -Force $dst | Out-Null; Push-Location $dst; git init -q; Pop-Location }
          Copy-Item artifacts/screenshots/*.png $dst
          Push-Location $dst
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Ảnh chụp giao diện từ lần build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-screenshots
          Pop-Location

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: qlvb-windows
          path: |
            artifacts/QLVB-portable-win-x64.zip
            artifacts/installer/*.exe
            artifacts/SHA256SUMS.txt
            artifacts/test-results/**
            artifacts/screenshots/**
          retention-days: 14
