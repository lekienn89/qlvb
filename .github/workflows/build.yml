name: build-windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Qlvb.slnx

      - name: Build
        run: dotnet build Qlvb.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/Qlvb.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test-results

      - name: Performance test (20.000 văn bản giả lập)
        run: dotnet test tests/Qlvb.Tests -c Release --no-build --filter "FullyQualifiedName~HieuNang" --logger "console;verbosity=detailed"
        env:
          QLVB_PERF: "20000"

      - name: Publish (single-file, self-contained, win-x64)
        id: publish
        run: dotnet publish src/Qlvb.App -c Release -o artifacts/publish

      - name: Sign application (nếu có chứng thư)
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          SIGN_TIMESTAMP_URL: ${{ vars.SIGN_TIMESTAMP_URL }}
        run: ./installer/sign.ps1 -Files artifacts/publish/QLVB.exe

      - name: UI smoke tests (FlaUI)
        run: dotnet test tests/Qlvb.UiTests -c Release --logger "trx;LogFileName=ui.trx" --results-directory artifacts/test-results
        env:
          QLVB_EXE: ${{ github.workspace }}\artifacts\publish\QLVB.exe
          QLVB_SCREENSHOTS: ${{ github.workspace }}\artifacts\screenshots

      - name: Tài liệu HTML
        id: docs
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q "markdown==3.11"
          python tools/build-docs.py artifacts/docs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable package
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: pwsh
        run: |
          $p = "artifacts/portable/QLVB-portable"
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item artifacts/publish/QLVB.exe, artifacts/publish/*.dll -Destination $p
          Set-Content -Path "$p/portable.flag" -Value "Ban portable: du lieu luu trong thu muc Data canh QLVB.exe" -Encoding utf8
          New-Item -ItemType Directory -Force "$p/docs" | Out-Null
          Copy-Item artifacts/docs/*.html -Destination "$p/docs"
          Copy-Item README.md, LICENSE, NOTICE.md, CHANGELOG.md -Destination $p
          Compress-Archive -Path "$p/*" -DestinationPath artifacts/QLVB-portable-win-x64.zip -Force

      - name: Installer (Inno Setup)
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp installer/qlvb.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer (nếu có chứng thư)
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          SIGN_TIMESTAMP_URL: ${{ vars.SIGN_TIMESTAMP_URL }}
        run: ./installer/sign.ps1 -Files artifacts/installer/*.exe

      - name: Checksums
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: pwsh
        run: |
          Get-ChildItem artifacts/*.zip, artifacts/installer/*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content artifacts/SHA256SUMS.txt
          Get-ChildItem artifacts/*.zip, artifacts/installer/*.exe | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.Name }
          Get-Content artifacts/SHA256SUMS.txt
          if (-not (Test-Path artifacts/installer/*.exe) -or -not (Test-Path artifacts/*.zip)) { Write-Error "Thieu goi cai dat hoac ban portable"; exit 1 }

      # Phát hành: mỗi khi phiên bản trong Directory.Build.props đổi (chưa có Release vX.Y.Z) và mọi bước trên đều đạt,
      # tạo tag vX.Y.Z trên commit này cùng GitHub Release kèm bộ cài, bản portable, SHA256SUMS.
      - name: GitHub Release
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $ver = ($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ }) | Select-Object -First 1
          $tag = "v$ver"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Da co Release $tag, bo qua."; exit 0 }
          $iss = Get-Content installer/qlvb.iss -Raw -Encoding utf8
          if ($iss -notmatch "#define AppVersion `"$([regex]::Escape($ver))`"") { Write-Error "Phien ban bo cai khong khop $ver"; exit 1 }
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($ver))\b.*?(?=^## |\z)")
          if (-not $m.Success) { Write-Error "CHANGELOG.md chua co muc $ver"; exit 1 }
          $notes = $m.Value + "`n`n### Tải về`n`n- **QLVB-Setup-$ver-win-x64.exe**: bộ cài đặt (không cần quyền quản trị).`n- **QLVB-portable-win-x64.zip**: bản portable, giải nén vào thư mục cố định (ví dụ D:\QLVB).`n- **SHA256SUMS.txt**: mã kiểm tra; đối chiếu trước khi cài (xem Hướng dẫn quản trị, mục 2.1).`n`nBộ cài chưa ký số: Windows có thể cảnh báo khi chạy lần đầu."
          Set-Content -Path artifacts/release-notes.md -Value $notes -Encoding utf8
          gh release create $tag artifacts/installer/*.exe artifacts/QLVB-portable-win-x64.zip artifacts/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Quản lý văn bản đi – đến $ver" --notes-file artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish screenshots to branch ci-screenshots
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/screenshots)) { exit 0 }
          $dst = Join-Path $env:RUNNER_TEMP "shots"
          git worktree add --orphan -b ci-screenshots-tmp $dst 2>$null
          if ($LASTEXITCODE -ne 0) { New-Item -ItemType Directory -Force $dst | Out-Null; Push-Location $dst; git init -q; Pop-Location }
          Copy-Item artifacts/screenshots/*.png $dst
          Push-Location $dst
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Ảnh chụp giao diện từ lần build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-screenshots
          Pop-Location

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: qlvb-windows
          path: |
            artifacts/QLVB-portable-win-x64.zip
            artifacts/installer/*.exe
            artifacts/SHA256SUMS.txt
            artifacts/test-results/**
            artifacts/screenshots/**
          retention-days: 14
